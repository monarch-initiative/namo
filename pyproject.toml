[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "namo"
description = "New Approach Methodology Ontology and Schema"
authors = [
  {name = "Chris Mungall", email = "cjmungall@lbl.gov"},
  {name = "Daniel Korn", email="dkorn@cs.unc.edu"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dynamic = ["version"]

[dependency-groups]
dev = [
    "oaklib",
    "linkml>=1.11.1",
    "pydantic>2.11.7", #Need for some LinkML dependancy weirdness.
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "linkml-reference-validator>=0.5.1",
    "linkml-term-validator>=0.4.5",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/namo/datamodel/namo_pydantic.py",
  "src/namo/datamodel/namo.py",
  # Generated docs (`just gen-doc`) and example outputs (`just test`).
  # Spell-check the schema and the records in tests/data/ instead; a hit in
  # these copies would have to be fixed at the source anyway.
  "docs/elements/*",
  "docs/schema/*",
  "examples/output/*",
  # Publication metadata fetched by linkml-reference-validator (`just test`).
  "references_cache/*",
  # Ontology labels fetched by linkml-term-validator (`just validate-terms`).
  "cache/*",
]

# Reminder: words have to be lowercased for the ignore-words-list
# Scientific terms that codespell misidentifies:
# villin (intestinal epithelial marker protein)
# Author surnames in example references:
# bothe (Anne-Katrin Bothe)
ignore-words-list = "bothe,linke,villin"
quiet-level = 3
