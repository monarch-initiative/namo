classes:
  NAMDataset:
    name: NAMDataset
    from_schema: https://w3id.org/monarch-initiative/namo
    is_a: dataset
    attributes:
      model_systems:
        name: model_systems
        from_schema: https://w3id.org/monarch-initiative/namo
        owner: NAMDataset
        domain_of:
        - NAMDataset
        range: ModelSystem
        multivalued: true
        inlined: true
        inlined_as_list: true
      studies:
        name: studies
        from_schema: https://w3id.org/monarch-initiative/namo
        owner: NAMDataset
        domain_of:
        - NAMDataset
        range: NAMStudy
        multivalued: true
        inlined: true
        inlined_as_list: true
      license:
        name: license
        description: A legal instrument under which the information content entity
          is made available, typically identified by a URL or CURIE pointing to a
          license document.
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - dct:license
        narrow_mappings:
        - WIKIDATA_PROPERTY:P275
        is_a: node property
        domain: information content entity
        owner: NAMDataset
        domain_of:
        - information content entity
        range: string
      rights:
        name: rights
        description: A statement describing rights held in or over the information
          content entity, such as copyright, intellectual property, or access and
          usage rights.
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - dct:rights
        is_a: node property
        domain: information content entity
        owner: NAMDataset
        domain_of:
        - information content entity
        range: string
      format:
        name: format
        description: The file format, physical medium, or representational form of
          the information content entity; for digital resources typically a MIME type
          or format identifier. Corresponds to dct:format.
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - dct:format
        - WIKIDATA_PROPERTY:P2701
        is_a: node property
        domain: information content entity
        owner: NAMDataset
        domain_of:
        - information content entity
        range: string
      creation date:
        name: creation date
        description: date on which an entity was created. This can be applied to nodes
          or edges
        from_schema: https://w3id.org/biolink/vocab/
        aliases:
        - publication date
        - date started
        exact_mappings:
        - dct:createdOn
        - WIKIDATA_PROPERTY:P577
        is_a: node property
        domain: named thing
        alias: creation_date
        owner: NAMDataset
        domain_of:
        - information content entity
        - clinical trial
        range: date
      provided by:
        name: provided by
        description: The value in this node property represents the knowledge provider
          that created or assembled the node and all of its attributes.  Used internally
          to represent how a particular node made its way into a knowledge provider
          or graph.
        from_schema: https://w3id.org/biolink/vocab/
        is_a: node property
        domain: named thing
        alias: provided_by
        owner: NAMDataset
        domain_of:
        - named thing
        range: string
        multivalued: true
      xref:
        name: xref
        description: A database cross reference or alternative identifier for a NamedThing
          or edge between two NamedThings.  This property should point to a database
          record or webpage that supports the existence of the edge, or gives more
          detail about the edge. This property can be used on a node or edge to provide
          multiple URIs or CURIE cross references.
        in_subset:
        - translator_minimal
        from_schema: https://w3id.org/biolink/vocab/
        aliases:
        - dbxref
        - Dbxref
        - DbXref
        - record_url
        - source_record_urls
        narrow_mappings:
        - gff3:Dbxref
        - gpi:DB_Xrefs
        domain: named thing
        owner: NAMDataset
        domain_of:
        - named thing
        - publication
        - retrieval source
        - gene
        - gene product mixin
        range: uriorcurie
        multivalued: true
      full name:
        name: full name
        description: a long-form human readable name for a thing
        from_schema: https://w3id.org/biolink/vocab/
        is_a: node property
        domain: named thing
        alias: full_name
        owner: NAMDataset
        domain_of:
        - named thing
        range: label type
      synonym:
        name: synonym
        description: Alternate human-readable names for a thing
        in_subset:
        - translator_minimal
        from_schema: https://w3id.org/biolink/vocab/
        aliases:
        - alias
        narrow_mappings:
        - skos:altLabel
        - gff3:Alias
        - AGRKB:synonyms
        - gpi:DB_Object_Synonyms
        - HANCESTRO:0330
        - IAO:0000136
        - RXNORM:has_tradename
        is_a: node property
        domain: named thing
        owner: NAMDataset
        domain_of:
        - named thing
        - gene product mixin
        range: label type
        multivalued: true
      exact synonym:
        name: exact synonym
        description: An alternate label for an entity that denotes exactly the same
          meaning as the primary label and is interchangeable with it in all contexts.
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - oboInOwl:hasExactSynonym
        is_a: synonym
        domain: named thing
        alias: exact_synonym
        owner: NAMDataset
        domain_of:
        - named thing
        range: label type
        multivalued: true
      broad synonym:
        name: broad synonym
        description: An alternate label for an entity whose meaning is broader (more
          general) than the primary label but is still useful as a lexical alternative.
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - oboInOwl:hasBroadSynonym
        is_a: synonym
        domain: named thing
        alias: broad_synonym
        owner: NAMDataset
        domain_of:
        - named thing
        range: label type
        multivalued: true
      narrow synonym:
        name: narrow synonym
        description: An alternate label for an entity whose meaning is narrower (more
          specific) than the primary label, for example naming a particular sub-type.
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - oboInOwl:hasNarrowSynonym
        is_a: synonym
        domain: named thing
        alias: narrow_synonym
        owner: NAMDataset
        domain_of:
        - named thing
        range: label type
        multivalued: true
      related synonym:
        name: related synonym
        description: An alternate label that is related to the primary label but is
          neither exactly synonymous nor cleanly broader or narrower; useful as a
          lexical pointer but not for strict equivalence. Corresponds to oboInOwl:hasRelatedSynonym.
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - oboInOwl:hasRelatedSynonym
        is_a: synonym
        domain: named thing
        alias: related_synonym
        owner: NAMDataset
        domain_of:
        - named thing
        range: label type
        multivalued: true
      equivalent identifiers:
        name: equivalent identifiers
        description: A set of identifiers that are considered equivalent to the primary
          identifier of the entity. This attribute is used to represent a collection
          of identifiers that are considered equivalent to the primary identifier
          of an entity. These equivalent identifiers may come from different databases,
          ontologies, or naming conventions, but they all refer to the same underlying
          concept or entity. This attribute is particularly useful in data integration
          and interoperability scenarios, where it is important to recognize and link
          different representations of the same entity across various sources.
        from_schema: https://w3id.org/biolink/biolink-model/attributes
        see_also:
        - biolink:xref
        - biolink:synonyms
        alias: equivalent_identifiers
        owner: NAMDataset
        domain_of:
        - named thing
        range: uriorcurie
        multivalued: true
      information content:
        name: information content
        description: Information content (IC) value for a term, primarily from Automats.
        from_schema: https://w3id.org/biolink/biolink-model/attributes
        alias: information_content
        owner: NAMDataset
        domain_of:
        - named thing
        range: float
      taxon:
        name: taxon
        description: A property that indicates the taxonomic classification of an
          entity. Values for this slot should be from the NCBITaxon ontology.
        comments:
        - Note there is also a predicate 'in taxon' that can be used to instantiate
          an edge between a taxon entity and a thing with taxon entity.  This is an
          acceptable practice for KG construction, but for many applications it is
          more convenient to use this property slot to directly annotate the taxon
          on the entity itself.
        in_subset:
        - translator_minimal
        from_schema: https://w3id.org/biolink/vocab/
        is_a: node property
        domain: named thing
        owner: NAMDataset
        domain_of:
        - named thing
        range: uriorcurie
      id:
        name: id
        description: A unique identifier for an entity. Must be either a CURIE shorthand
          for a URI or a complete URI
        in_subset:
        - translator_minimal
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - AGRKB:primaryId
        - gff3:ID
        - gpi:DB_Object_ID
        domain: entity
        identifier: true
        owner: NAMDataset
        domain_of:
        - ontology class
        - entity
        - Reference
        range: string
        required: true
      iri:
        name: iri
        description: An IRI for an entity. This is determined by the id using expansion
          rules.
        in_subset:
        - translator_minimal
        - samples
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - WIKIDATA_PROPERTY:P854
        owner: NAMDataset
        domain_of:
        - attribute
        - entity
        range: iri type
      category:
        name: category
        description: Name of the high level ontology class in which this entity is
          categorized. Corresponds to the label for the biolink entity type class.
          In a neo4j database this MAY correspond to the neo4j label tag. In an RDF
          database it should be a biolink model class URI. This field is multi-valued.
          It should include values for ancestors of the biolink class; for example,
          a protein such as Shh would have category values `biolink:Protein`, `biolink:GeneProduct`,
          `biolink:MolecularEntity`. In an RDF database, nodes will typically have
          an rdf:type triples. This can be to the most specific biolink class, or
          potentially to a class more specific than something in biolink. For example,
          a sequence feature `f` may have a rdf:type assertion to a SO class such
          as TF_binding_site, which is more specific than anything in biolink. Here
          we would have categories {biolink:GenomicEntity, biolink:MolecularEntity,
          biolink:NamedThing}
        in_subset:
        - translator_minimal
        from_schema: https://w3id.org/biolink/vocab/
        is_a: type
        domain: entity
        designates_type: true
        owner: NAMDataset
        domain_of:
        - entity
        is_class_field: true
        range: uriorcurie
        required: true
        multivalued: true
      type:
        name: type
        description: An rdf:type property asserting that an entity is an instance
          of a particular class. In Biolink the value is typically used to indicate
          the most specific category of which the entity is an instance.
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - gff3:type
        - gpi:DB_Object_Type
        domain: entity
        slot_uri: rdf:type
        owner: NAMDataset
        domain_of:
        - entity
        range: string
        multivalued: true
      name:
        name: name
        description: A human-readable name for an attribute or entity.
        in_subset:
        - translator_minimal
        - samples
        from_schema: https://w3id.org/biolink/vocab/
        aliases:
        - label
        - display name
        - title
        exact_mappings:
        - gff3:Name
        - gpi:DB_Object_Name
        narrow_mappings:
        - dct:title
        - WIKIDATA_PROPERTY:P1476
        domain: entity
        slot_uri: rdfs:label
        owner: NAMDataset
        domain_of:
        - attribute
        - entity
        - macromolecular machine mixin
        range: label type
      description:
        name: description
        description: a human-readable description of an entity
        in_subset:
        - translator_minimal
        from_schema: https://w3id.org/biolink/vocab/
        aliases:
        - definition
        exact_mappings:
        - IAO:0000115
        - skos:definitions
        narrow_mappings:
        - gff3:Description
        slot_uri: dct:description
        owner: NAMDataset
        domain_of:
        - entity
        range: narrative text
      has attribute:
        name: has attribute
        description: connects any entity to an attribute
        in_subset:
        - samples
        from_schema: https://w3id.org/biolink/vocab/
        exact_mappings:
        - SIO:000008
        close_mappings:
        - OBI:0001927
        narrow_mappings:
        - OBAN:association_has_subject_property
        - OBAN:association_has_object_property
        - CPT:has_possibly_included_panel_element
        - DRUGBANK:category
        - EFO:is_executed_in
        - HANCESTRO:0301
        - LOINC:has_action_guidance
        - LOINC:has_adjustment
        - LOINC:has_aggregation_view
        - LOINC:has_approach_guidance
        - LOINC:has_divisor
        - LOINC:has_exam
        - LOINC:has_method
        - LOINC:has_modality_subtype
        - LOINC:has_object_guidance
        - LOINC:has_scale
        - LOINC:has_suffix
        - LOINC:has_time_aspect
        - LOINC:has_time_modifier
        - LOINC:has_timing_of
        - NCIT:R88
        - NCIT:eo_disease_has_property_or_attribute
        - NCIT:has_data_element
        - NCIT:has_pharmaceutical_administration_method
        - NCIT:has_pharmaceutical_basic_dose_form
