---
# https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      # Generated docs, example outputs and the reference and term caches
      # (written by linkml-reference-validator and linkml-term-validator) are
      # excluded from the whitespace
      # fixers. A hook rewrite would make them differ from what the generators
      # produce. Fix the generator or the source record, not the committed copy.
      - id: end-of-file-fixer
        exclude: &generated ^(docs/elements|docs/schema|examples/output|references_cache|cache)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]
        exclude: *generated

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.6.12
    hooks:
      - id: uv-lock
