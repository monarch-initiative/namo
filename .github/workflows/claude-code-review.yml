---
# Reviews each pull request with Claude Code and posts the review on the PR.
# Built from:
# https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret, made with
# `claude setup-token`. The token lasts one year: the current one was set
# on 2026-11-11, so renew it by November 2027.
name: Claude Code Review

on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

jobs:
  claude-review:
    # Draft PRs are reviewed when they are marked ready. PRs from forks
    # cannot read the token, so they are skipped. To review a PR again,
    # re-run this job from the PR's checks.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # https://github.com/anthropics/claude-code-action
      - name: Review the pull request
        uses: anthropics/claude-code-action@v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post as github-actions[bot] with this job's token, so the
          # Claude GitHub App is not needed to post the review.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repository is NAMO, a LinkML
            schema for New Approach Methodologies. The source schema is
            src/namo/schema/namo.yaml; the Python datamodels, docs/ and
            project/ are generated from it. Read CLAUDE.md and
            CONTRIBUTING.md for its conventions.

            Look for, in order of importance:
            1. Bugs: schema changes that `linkml-lint` or `just test` would
               reject, that generate the wrong datamodel, or that break
               existing data in tests/data/ or examples/.
            2. Modelling: wrong ranges, cardinality, enum bindings,
               ontology terms or mappings, and slots or classes that
               duplicate existing ones.
            3. Generated files that are out of step with the schema
               change in the same PR.

            Report only problems you can point to in the diff, each with
            the concrete input or case that goes wrong. Skip style
            preferences. Use an inline comment for each problem, then one
            short top-level comment that summarises the review. If you find
            nothing, say so in one line.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
